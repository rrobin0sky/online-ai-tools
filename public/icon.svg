<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern App Icon Rounded Base -->
  <rect width="32" height="32" rx="7.5" fill="url(#arch-bg)"/>
  <rect width="32" height="32" rx="7.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- 30° Isometric Cube & Topology Node -->
  <g filter="url(#glow)">
    <!-- Cube Outer Frame -->
    <path
      d="M16 5.5 L25 10.7 V21.3 L16 26.5 L7 21.3 V10.7 Z"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <!-- Internal Isometric Y Split -->
    <path
      d="M16 5.5 V16 L25 10.7 M16 16 L7 10.7 M16 16 V26.5"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.8"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Glowing Central Topology Core Hub -->
    <circle cx="16" cy="16" r="2.6" fill="#38bdf8"/>
    <circle cx="16" cy="16" r="1.4" fill="#ffffff"/>
  </g>
</svg>
